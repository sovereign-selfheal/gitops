# `global` is passed by the bootstrap chart. The defaults below exist only so that
# `helm lint` works. This component reads `global.appsDomain`, `global.namespaces.triage`
# (for default MCP URLs) and `global.namespacePolicy.hint` — same contract as
# components/triage-agent.
global:
  appsDomain: apps.example.com
  namespaces:
    triage: agentic-triage
  namespacePolicy:
    hint: false

# Name of the TriageAgent CR (and, via the operator, of every child resource it owns:
# ServiceAccount, Deployment, Service, Route, ConfigMaps, apikey Secret). Change this
# when reusing the chart for a second instance in the same namespace (rare); a second
# instance in another namespace just needs a different namespaceRef in bootstrap, the
# default name is fine there too.
name: triage-agent

# Images of the triage-agent repo and the OGX sidecar (see AGENTS.md section 4 and 6 of
# the gitops repo for the pin convention). Kept in sync with components/triage-agent's
# values.yaml and the operator's own built-in defaults (triage-agent-operator
# app/config.py); set here explicitly so a bump is one PR in this repo, same as every
# other component.
# tag v0.2.0, resolved on quay.io on 2026-10-04
image: quay.io/sovereign-selfheal/triage-agent@sha256:a8340b5c1b4006dc8418a8c2646caeaf03e3bb52bad41e2830895a32605b7781
# tag latest, resolved on docker.io on 2026-09-29
ogxImage: docker.io/ogxai/distribution-starter@sha256:9d6afd54417bee1f37768a054e198becfadbed21d270d8ec1cdfb699e35e9924

# Omit (set to null) to let an external autoscaler own replica count; the operator then
# never writes spec.replicas on the Deployment it manages.
replicas: 1

# Model alias of the router the agent calls. "auto" lets the policy hook pick the real
# target (local model or SOTA) per request, same as any other client.
model: auto
# The router's TLS certificate is expected to be valid (OpenShift wildcard/ACME): keep
# verification on. Set to false only against a self-signed/dev appsDomain.
vllmTlsVerify: true

# Own tier of the router token budget (bootstrap/values.yaml `tiers`): keep this name
# equal to one entry of global.tiers, or the agent's calls are not rate-limited at all.
# Use "agents-critical" for a dedicated per-namespace agent of a business-critical
# application (see the tier's comment in bootstrap/values.yaml).
apiKeyTier: agents
apiKey:
  prefix: 'sk-'
  length: 40
  # Name of an existing Secret (key api_key) to mount instead of letting the operator
  # generate one. Leave empty for the operator's own generated Secret (see
  # triage-agent-operator AGENTS.md section 4: plain Secret, no ESO dependency).
  existingSecret: ''

# MCP server URLs the Gradio container passes to OGX. Empty defaults to the namespaced
# in-cluster Service DNS of components/prometheus-mcp-server and
# components/ticketing-mcp-server, same pattern as components/triage-agent. Only set
# these when this instance's MCP servers live in a different namespace than the agent.
mcpServers:
  prometheus: ''
  ticketing: ''
  # Optional Kubernetes-API MCP server (pods, logs, events). Empty: the agent runs
  # without that tool (see AGENTS.md section 4.4 of the gitops repo).
  ocp: ''

# Static application knowledge injected into the agent system prompt (KNOWLEDGE_FILE).
knowledge:
  mountPath: /etc/triage-agent
  file: knowledge.md
  # Existing ConfigMap (same data key as `file`) to mount instead of inlining content
  # from this chart. Takes priority over useDefaultFile.
  existingConfigMap: ''
  # When true (default) and existingConfigMap is empty, inline files/knowledge.md (the
  # quarkus-buggy-app runbook) as spec.knowledge.content; the operator creates and owns
  # the ConfigMap. Set to false for an instance with no inline knowledge (e.g. one that
  # only uses existingConfigMap, or none at all).
  useDefaultFile: true

# Sends the namespaces of the investigation to the router (router v0.11.0+ namespace
# policy). Leave null to inherit global.namespacePolicy.hint, same as
# components/triage-agent.
namespaceHint: null

route:
  enabled: true
  # Optional explicit hostname; default is operator/OpenShift-assigned.
  host: ''

resources:
  # Gradio UI container: just renders the chat and streams the OGX response, no inference.
  agent:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # OGX sidecar: runs the agentic loop and holds the sqlite stores (responses, kv).
  ogx:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
