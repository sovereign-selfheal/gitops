# ServiceAccount bound (ansible repo, cluster-scoped RBAC: see AGENTS.md section 2) to the
# built-in ClusterRole cluster-monitoring-view, so this server can read Thanos across
# namespaces. Renaming this ServiceAccount needs the matching change in the ansible repo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-mcp-server-sa
  labels:
    app: prometheus-mcp-server
---
# MCPServer CR (RHOAI MCP lifecycle operator, ansible-owned). The operator creates the
# Deployment, Service and probes, and registers the server in the OpenShift AI MCP catalog.
apiVersion: mcp.x-k8s.io/v1alpha1
kind: MCPServer
metadata:
  name: prometheus-mcp-server
  labels:
    app: prometheus-mcp-server
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: {{ .Values.image }}

  config:
    port: 8080
    path: /mcp
    env:
      - name: MCP_PORT
        value: "8080"
      # In-cluster Thanos Querier (ansible repo enables user workload monitoring).
      - name: THANOS_URL
        value: https://thanos-querier.openshift-monitoring.svc:9091
      - name: PYTHONUNBUFFERED
        value: "1"

  runtime:
    replicas: {{ .Values.replicas }}
    resources:
      {{- toYaml .Values.resources | nindent 6 }}
    security:
      # The CRD has the ServiceAccount here (runtime.security.serviceAccountName). At
      # runtime.serviceAccountName the field was dropped: the pod ran with the default
      # ServiceAccount, Thanos answered 403 and the Application stayed OutOfSync.
      serviceAccountName: prometheus-mcp-server-sa
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
    health:
      livenessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 10
        failureThreshold: 3
      readinessProbe:
        tcpSocket:
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 3

  mcp:
    stateless: true
