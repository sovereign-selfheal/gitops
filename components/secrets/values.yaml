# `global` is passed by the bootstrap chart. The defaults below exist only for `helm lint`.
global:
  secretStore:
    enabled: true
    name: example-store
    kind: ClusterSecretStore
    sota:
      key: example/sota
      property: api_key
    classifier:
      key: example/classifier
      baseUrlProperty: base_url
      modelProperty: model
      apiKeyProperty: api_key
  classifier:
    enabled: true
    grayLow: "0"
  tiers:
    - name: example
      tokens: 1000
      window: 60s

# Refresh interval of the Secrets that come from the external store.
refreshInterval: 1h
# Generated API keys: `sk-` + 40 random characters, generated once.
apiKey:
  prefix: sk-
  length: 40
