{{- $store := .Values.global.secretStore }}
{{- if $store.enabled }}
# SOTA provider key. Only COMPANY_API_KEY: a LITELLM_MASTER_KEY here would make
# LiteLLM require its own auth and break every call through the gateway.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sota-provider-secret
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind }}
  target:
    name: sota-provider-secret
    creationPolicy: Owner
  data:
    - secretKey: COMPANY_API_KEY
      remoteRef:
        key: {{ $store.sota.key }}
        property: {{ $store.sota.property }}
{{- if eq .Values.global.classifier.mode "external" }}
---
# External C2 classifier (LLM) of the privacy gate (classifier.mode: external).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: classifier-provider-secret
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ $store.kind }}
  target:
    name: classifier-provider-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CLASSIFIER_BASE_URL: {{ "{{ .base_url }}" | quote }}
        CLASSIFIER_MODEL: {{ "{{ .model }}" | quote }}
        CLASSIFIER_API_KEY: {{ "{{ .api_key }}" | quote }}
        CLASSIFIER_ENABLED: "1"
        CLASSIFIER_GRAY_LOW: {{ .Values.global.classifier.grayLow | quote }}
  data:
    - secretKey: base_url
      remoteRef:
        key: {{ $store.classifier.key }}
        property: {{ $store.classifier.baseUrlProperty }}
    - secretKey: model
      remoteRef:
        key: {{ $store.classifier.key }}
        property: {{ $store.classifier.modelProperty }}
    - secretKey: api_key
      remoteRef:
        key: {{ $store.classifier.key }}
        property: {{ $store.classifier.apiKeyProperty }}
{{- end }}
{{- end }}
