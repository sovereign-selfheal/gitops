# One API key per tier, generated in the cluster (no external store needed).
# refreshInterval "0": the key is generated once and never rotated.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: apikey
spec:
  length: {{ .Values.apiKey.length }}
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
{{- range .Values.global.tiers }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apikey-{{ .name }}-1
spec:
  refreshInterval: "0"
  target:
    name: apikey-{{ .name }}-1
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        # Read by the AuthPolicy (component frontdoor): maas-group is the tier.
        labels:
          authorino.kuadrant.io/managed-by: authorino
          app: maas-litellm
          maas-group: {{ .name }}
      data:
        api_key: {{ printf "%s{{ .password }}" $.Values.apiKey.prefix | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: apikey
{{- end }}
