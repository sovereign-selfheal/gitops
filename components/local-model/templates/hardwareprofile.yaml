{{- /*
RHOAI hardware profile of the local model, in the model namespace (project scope). The RHOAI
dashboard shows it on the deployment, and a UI deployment in this project can use it. Its values
come from the same model values as the InferenceService, so the two cannot diverge: the
odh-model-controller webhook copies the profile scheduling into the InferenceService.
*/ -}}
{{- $m := .Values.global.localModel }}
{{- $req := required "localModel.resources.requests is required" $m.resources.requests }}
{{- $lim := required "localModel.resources.limits is required" $m.resources.limits }}
apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: {{ include "local-model.hardwareProfileName" . }}
  labels:
    app.opendatahub.io/hardwareprofile: "true"
  annotations:
    # Before the InferenceService, which names this profile.
    argocd.argoproj.io/sync-wave: "-1"
    opendatahub.io/display-name: {{ $m.hardwareProfile.displayName | quote }}
    opendatahub.io/description: {{ $m.hardwareProfile.description | quote }}
    opendatahub.io/disabled: "false"
    opendatahub.io/dashboard-feature-visibility: '[]'
spec:
  identifiers:
    - identifier: cpu
      displayName: CPU
      resourceType: CPU
      minCount: {{ $req.cpu | quote }}
      defaultCount: {{ $req.cpu | quote }}
      maxCount: {{ $lim.cpu | quote }}
    - identifier: memory
      displayName: Memory
      resourceType: Memory
      minCount: {{ $req.memory | quote }}
      defaultCount: {{ $req.memory | quote }}
      maxCount: {{ $lim.memory | quote }}
    {{- if gt (int $m.gpu) 0 }}
    - identifier: nvidia.com/gpu
      displayName: GPU
      resourceType: Accelerator
      minCount: {{ int $m.gpu }}
      defaultCount: {{ int $m.gpu }}
      maxCount: {{ int $m.gpu }}
  scheduling:
    type: Node
    node:
      nodeSelector:
        {{- include "local-model.gpuNodeSelector" . | nindent 8 }}
      tolerations:
        {{- include "local-model.gpuTolerations" . | nindent 8 }}
    {{- end }}
