{{- $m := .Values.global.localModel }}
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ $m.name }}
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    # RHOAI 3.5 name of the former RawDeployment mode (the webhook rewrites the old name).
    serving.kserve.io/deploymentMode: Standard
    openshift.io/display-name: {{ $m.displayName }}
    # Links the model to its runtime in the RHOAI dashboard.
    opendatahub.io/template-name: {{ $m.runtimeTemplate }}
    opendatahub.io/template-display-name: {{ $m.runtimeDisplayName }}
    # Links the model to its hardware profile (templates/hardwareprofile.yaml).
    opendatahub.io/hardware-profile-name: {{ include "local-model.hardwareProfileName" . }}
    opendatahub.io/hardware-profile-namespace: {{ .Release.Namespace }}
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    {{- if gt (int $m.gpu) 0 }}
    # Recreate: stop the old pod before the new one starts. With one GPU per model, a rolling
    # update deadlocks: the new pod waits for a GPU that the old pod keeps until the new one is Ready.
    deploymentStrategy:
      type: Recreate
    # Same scheduling as the hardware profile: the webhook copies the profile scheduling here,
    # so Git declares it too.
    nodeSelector:
      {{- include "local-model.gpuNodeSelector" . | nindent 6 }}
    tolerations:
      {{- include "local-model.gpuTolerations" . | nindent 6 }}
    {{- end }}
    model:
      runtime: {{ $m.runtime }}
      modelFormat:
        name: vLLM
      storageUri: {{ $m.storageUri }}
      resources:
        requests:
          {{- with $m.resources.requests }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- if gt (int $m.gpu) 0 }}
          nvidia.com/gpu: {{ $m.gpu | quote }}
          {{- end }}
        limits:
          {{- with $m.resources.limits }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- if gt (int $m.gpu) 0 }}
          nvidia.com/gpu: {{ $m.gpu | quote }}
          {{- end }}
