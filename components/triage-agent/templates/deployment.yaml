apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage-agent
  labels:
    app: triage-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-agent
  labels:
    app: triage-agent
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: triage-agent
  template:
    metadata:
      labels:
        app: triage-agent
    spec:
      serviceAccountName: triage-agent
      containers:
        # ── OGX sidecar: server-side agentic loop (Responses API), talks MCP natively ──
        - name: ogx-server
          image: {{ .Values.ogxImage }}
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - ogx.core.server.server:create_app
            - --host
            - "0.0.0.0"
            - --port
            - "8321"
            - --factory
          ports:
            - name: ogx-http
              containerPort: 8321
          env:
            - name: OGX_CONFIG
              value: /etc/ogx/stack_run_config.yaml
            - name: OGX_LOGGING
              value: all=INFO
            - name: SQLITE_STORE_DIR
              value: /tmp/ogx
            # The platform gateway (component frontdoor): same endpoint external MaaS
            # clients use. Model "auto" (registered in stack_run_config.yaml) lets the
            # policy hook of components/litellm-router pick the real target per request.
            - name: VLLM_URL
              value: {{ printf "https://router.%s/v1" (required "global.appsDomain is required" .Values.global.appsDomain) | quote }}
            - name: VLLM_MAX_TOKENS
              value: "8192"
            - name: VLLM_TLS_VERIFY
              value: {{ .Values.vllmTlsVerify | quote }}
            - name: VLLM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: triage-agent-apikey
                  key: api_key
            - name: INFERENCE_MODEL
              value: {{ .Values.model | quote }}
            - name: OPENAI_MAX_RETRIES
              value: "8"
          volumeMounts:
            - name: ogx-config
              mountPath: /etc/ogx
            - name: ogx-data
              mountPath: /tmp/ogx
          livenessProbe:
            httpGet:
              path: /v1/models
              port: 8321
            initialDelaySeconds: 45
            periodSeconds: 20
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8321
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources.ogx | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # ── Gradio UI: renders the chat, streams the OGX Responses API ──────────────────
        - name: triage-agent
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7860
          env:
            - name: GRADIO_PORT
              value: "7860"
            - name: GRADIO_ANALYTICS_ENABLED
              value: "False"
            - name: OGX_BASE_URL
              value: http://localhost:8321
            - name: ROUTER_MODEL
              value: {{ .Values.model | quote }}
            - name: PROMETHEUS_MCP_URL
              value: {{ printf "http://prometheus-mcp-server.%s.svc:8080/mcp" (required "global.namespaces.triage is required" .Values.global.namespaces.triage) | quote }}
            - name: TICKETING_MCP_URL
              value: {{ printf "http://ticketing-mcp-server.%s.svc:8080/mcp" .Values.global.namespaces.triage | quote }}
            # Kubernetes API MCP server (pods, logs, events): not part of this component,
            # deployed separately if needed (see AGENTS.md section 3b). Empty: the agent
            # runs without that tool.
            - name: OCP_MCP_URL
              value: {{ .Values.ocpMcpUrl | default "" | quote }}
            - name: PYTHONUNBUFFERED
              value: "1"
          livenessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources.agent | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: ogx-config
          configMap:
            name: triage-agent-ogx-config
        - name: ogx-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: triage-agent
  labels:
    app: triage-agent
spec:
  selector:
    app: triage-agent
  ports:
    - name: http
      port: 7860
      targetPort: http
---
# Chat UI, external (edge TLS). No Kuadrant auth: this is the human-facing demo UI, not
# the model gateway (the agent's own calls to the router go through components/frontdoor
# and its AuthPolicy, like any other client).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: triage-agent
  labels:
    app: triage-agent
spec:
  to:
    kind: Service
    name: triage-agent
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
