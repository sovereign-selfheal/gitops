# `global` is passed by the bootstrap chart. The defaults below exist only for `helm lint`.
global:
  appsDomain: apps.example.com
  namespaces:
    triage: agentic-triage

# Image of the triage-agent repo (github.com/sovereign-selfheal/triage-agent): Gradio UI,
# talking to the OGX sidecar's Responses API (see AGENTS.md section 3b). The agentic loop
# itself (tool calling, MCP orchestration) runs server-side in the ogx-server container.
# tag v0.2.0, resolved on quay.io on 2026-10-04
image: quay.io/sovereign-selfheal/triage-agent@sha256:a8340b5c1b4006dc8418a8c2646caeaf03e3bb52bad41e2830895a32605b7781
replicas: 1

# OGX sidecar (ogxai/distribution-starter, upstream project, not a sovereign-selfheal repo:
# there is no source-code or CI contract for this image, unlike the other four AI-driven
# triage components. Pinned by digest like every other image (AGENTS.md section 6); bump it
# with a manual PR, same as router/presidio.
# tag latest, resolved on docker.io on 2026-09-29
ogxImage: docker.io/ogxai/distribution-starter@sha256:9d6afd54417bee1f37768a054e198becfadbed21d270d8ec1cdfb699e35e9924

# Model alias of the router the agent calls (components/litellm-router): "auto" lets the
# policy hook pick the real target (local model or SOTA) per request, same as any other
# client. OGX lists the router models itself and adds the provider prefix, so the agent and
# OGX use "router/<model>" (ROUTER_MODEL, INFERENCE_MODEL in templates/deployment.yaml).
model: auto

# The router's TLS certificate is expected to be valid (OpenShift wildcard/ACME): keep
# verification on. Set to false only against a self-signed/dev appsDomain.
vllmTlsVerify: true

# Static application knowledge injected into the agent system prompt (KNOWLEDGE_FILE).
# Default: render triage-agent-knowledge from files/knowledge.md. For another agent
# instance, point existingConfigMap at a different ConfigMap (same data key: knowledge.file).
knowledge:
  mountPath: /etc/triage-agent
  file: knowledge.md
  existingConfigMap: ""

# Own tier of the router token budget (bootstrap/values.yaml `tiers`): keep this name
# equal to one entry of global.tiers, or the agent's calls are not rate-limited at all.
apiKeyTier: agents
# Generated API key: `sk-` + 40 random characters, generated once (same recipe as
# components/secrets).
apiKey:
  prefix: sk-
  length: 40

resources:
  # Gradio UI container: just renders the chat and streams the OGX response, no inference.
  agent:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # OGX sidecar: runs the agentic loop and holds the sqlite stores (responses, kv).
  ogx:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
