# `global` is passed by the bootstrap chart. The defaults below exist only for `helm lint`.
global:
  appsDomain: apps.example.com
  namespaces:
    triage: agentic-triage
    payments: payments
    rhReserve: rh-reserve
    reverseProxyApp: reverse-proxy-app

# Image of the ogx-alert-translator repo (github.com/sovereign-selfheal/ogx-alert-translator).
# tag fix_per-namespace-trigger-url, resolved on quay.io on 2026-10-14
image: quay.io/sovereign-selfheal/ogx-alert-translator@sha256:f7b19de1d88787429ef5f0dfe47d67f16bc481df912678461438868e9cc68e98
# Used only when KEDA is off (keda.httpAddon.enabled and keda.prometheus.enabled false). With
# KEDA the Deployment has no replicas field: KEDA owns the number of pods.
replicas: 0

keda:
  # Primary: KEDA HTTP add-on (installed by ansible). Alertmanager should POST to the
  # interceptor Service fronting this workload when httpAddon is true.
  httpAddon:
    enabled: true
    minReplicas: 0
    maxReplicas: 3
    targetPendingRequests: 1
    scaledownPeriod: 300
  # Fallback when the HTTP add-on is not installed: scale on firing alerts (Alertmanager retries).
  prometheus:
    enabled: false
    serverAddress: http://thanos-querier.openshift-monitoring.svc:9091
    minReplicas: 0
    maxReplicas: 3
    cooldownPeriod: 300

# Alertmanager notification routing (merged by platform Alertmanager when ansible sets
# alertmanagerMain.enableUserAlertmanagerConfig). Only used with the KEDA HTTP add-on.
alertmanager:
  alertname: QuarkusBuggyAppHighErrorRate
  webhookUrl: http://keda-add-ons-http-interceptor-proxy.openshift-keda.svc:8080/webhook
  # Alertmanager sends a firing alert again after this time (sendResolved stays false). The apps
  # of the demo keep failing, so their alerts stay firing: each agent gets a new investigation
  # about once per interval. Without it the route inherits 12h from the platform Alertmanager.
  repeatInterval: 1h
  # Keys of global.namespaces with a buggy-app instance (one per monitored
  # application, each with its own agent). Keep in sync with
  # alerts.quarkusBuggyApp.namespaceRefs of components/observability.
  namespaceRefs:
    - payments
    - rhReserve
    - reverseProxyApp

# Name and port of the triage-agent Service that runs in the *alert's own* namespace (one
# TriageAgent CR per monitored-application namespace, see components/triage-agent-operator-cr).
# The translator builds the target URL itself from the alert's `namespace` label:
# http://<triageAgentService>.<alert namespace>.svc:<triageAgentPort>/trigger. This keeps one
# translator shared by every agent, instead of one translator per namespace.
triageAgentService: triage-agent
triageAgentPort: 7860

# Short timeout: this service only waits for the agent's 202 ack on /trigger, not the
# full (multi-minute) agent run, which the agent executes in its own background task.
requestTimeoutSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
