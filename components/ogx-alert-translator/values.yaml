# `global` is passed by the bootstrap chart. The defaults below exist only for `helm lint`.
global:
  appsDomain: apps.example.com
  namespaces:
    triage: agentic-triage
    triageRestricted: payments

# Image of the ogx-alert-translator repo (github.com/sovereign-selfheal/ogx-alert-translator).
# tag v0.1.0, resolved on quay.io on 2026-10-05
image: quay.io/sovereign-selfheal/ogx-alert-translator@sha256:b019e5b342d0068c7a86f47952f64f329690db2d49b9ad47af7e1f5ec96817de
# Used only when KEDA is off (keda.httpAddon.enabled and keda.prometheus.enabled false). With
# KEDA the Deployment has no replicas field: KEDA owns the number of pods.
replicas: 0

keda:
  # Primary: KEDA HTTP add-on (installed by ansible). Alertmanager should POST to the
  # interceptor Service fronting this workload when httpAddon is true.
  httpAddon:
    enabled: true
    minReplicas: 0
    maxReplicas: 3
    targetPendingRequests: 1
    scaledownPeriod: 300
  # Fallback when the HTTP add-on is not installed: scale on firing alerts (Alertmanager retries).
  prometheus:
    enabled: false
    serverAddress: http://thanos-querier.openshift-monitoring.svc:9091
    minReplicas: 0
    maxReplicas: 3
    cooldownPeriod: 300

# Alertmanager notification routing (merged by platform Alertmanager when ansible sets
# alertmanagerMain.enableUserAlertmanagerConfig). Only used with the KEDA HTTP add-on.
alertmanager:
  alertname: QuarkusBuggyAppHighErrorRate
  webhookUrl: http://keda-add-ons-http-interceptor-proxy.openshift-keda.svc:8080/webhook
  # Keys of global.namespaces with a quarkus-buggy-app instance. Keep in sync with
  # alerts.quarkusBuggyApp.namespaceRefs of components/observability.
  namespaceRefs:
    - triage
    - triageRestricted

# Short timeout: this service only waits for triage-agent's 202 ack on /trigger, not the
# full (multi-minute) agent run, which triage-agent executes in its own background task.
requestTimeoutSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
