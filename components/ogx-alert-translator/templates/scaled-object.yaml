{{- if .Values.keda.httpAddon.enabled }}
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: ogx-alert-translator
  labels:
    app: ogx-alert-translator
spec:
  # Empty: the interceptor routes the requests of every Host to this app (HTTP add-on 0.14 or
  # later; the one of Custom Metrics Autoscaler 2.19.0 does, checked on 2026-10-05). Give
  # explicit hosts when another HTTPScaledObject shares the interceptor.
  hosts: []
  targetPendingRequests: {{ .Values.keda.httpAddon.targetPendingRequests }}
  scaleTargetRef:
    name: ogx-alert-translator
    kind: Deployment
    apiVersion: apps/v1
    service: ogx-alert-translator
    port: 8080
  replicas:
    min: {{ .Values.keda.httpAddon.minReplicas }}
    max: {{ .Values.keda.httpAddon.maxReplicas }}
  scaledownPeriod: {{ .Values.keda.httpAddon.scaledownPeriod }}
{{- else if .Values.keda.prometheus.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ogx-alert-translator
  labels:
    app: ogx-alert-translator
spec:
  scaleTargetRef:
    name: ogx-alert-translator
  minReplicaCount: {{ .Values.keda.prometheus.minReplicas }}
  maxReplicaCount: {{ .Values.keda.prometheus.maxReplicas }}
  cooldownPeriod: {{ .Values.keda.prometheus.cooldownPeriod }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.keda.prometheus.serverAddress | quote }}
        metricName: alertmanager_firing_alerts
        threshold: "1"
        query: sum(ALERTS{alertstate="firing"})
{{- end }}
