# ServiceAccount of LiteLLM. With the namespace policy on (router v0.11.0), the hook reads the
# labels of the namespaces with it: the ansible repo binds get/list/watch on namespaces to
# maas-routing/litellm (roles/argocd_seed), because the AppProject allows no cluster-scoped objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  labels:
    app: litellm
