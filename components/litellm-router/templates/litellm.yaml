apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      annotations:
        # Restart LiteLLM when its config changes (it reads the files only at start).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Restart LiteLLM when the secret store is turned on: env vars from Secrets are
        # read only at start.
        secret-store/enabled: {{ dig "secretStore" "enabled" false .Values.global | quote }}
    spec:
      # Own ServiceAccount: with the namespace policy on, the hook reads the namespace labels
      # (get/list/watch on namespaces, bound by the ansible repo to maas-routing/litellm).
      serviceAccountName: litellm
      # Prefer one replica per node. "Preferred": it never blocks scheduling.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: litellm
      containers:
        - name: litellm
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: ["litellm"]
          args: ["--config", "/app/litellm/config-chain.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
            # Router metrics and LiteLLM metrics (router v0.5.0+), scraped by user workload
            # monitoring through the ServiceMonitor below.
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          env:
            - name: POLICY_DIR
              value: /app/litellm
            - name: PYTHONPATH
              value: /app/litellm
            - name: ROUTER_METRICS_PORT
              value: {{ .Values.metricsPort | quote }}
            {{- if .Values.global.observability.enabled }}
            # Traces: read by the `otel` callback of LiteLLM (not by the hook).
            - name: OTEL_EXPORTER
              value: otlp_http
            - name: OTEL_ENDPOINT
              value: {{ required "global.observability.otlpEndpoint is required" .Values.global.observability.otlpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: litellm-router
            # One child span for the LLM call (litellm_request, with the api_base of the model)
            # under the proxy request span. Without it LiteLLM only adds attributes to the parent.
            - name: USE_OTEL_LITELLM_REQUEST_SPAN
              value: "true"
            {{- end }}
            {{- if eq .Values.global.classifier.mode "local" }}
            {{- $dm := .Values.global.decisionModel | default dict }}
            {{- $qwenUrl := printf "http://%s-predictor.%s.svc.cluster.local/v1" .Values.global.localModel.name .Values.global.namespaces.models }}
            # C2 classifier = a local model: the prompt never leaves the cluster.
            - name: CLASSIFIER_ENABLED
              value: "1"
            {{- if $dm.enabled }}
            # With the decision model (router v0.7.0 or later): C2 asks the decision server
            # (systemone backend). On an error or a timeout it asks the local chat model
            # (fallback); only when both fail, the prompt stays LOCAL (fail-closed).
            - name: CLASSIFIER_BACKEND
              value: systemone
            - name: CLASSIFIER_BASE_URL
              value: {{ printf "http://%s-predictor.%s.svc.cluster.local/v1" $dm.name .Values.global.namespaces.models | quote }}
            - name: CLASSIFIER_MODEL
              value: {{ $dm.servedModelName | quote }}
            - name: CLASSIFIER_FALLBACK_BASE_URL
              value: {{ $qwenUrl | quote }}
            - name: CLASSIFIER_FALLBACK_MODEL
              value: {{ .Values.global.localModel.name | quote }}
            # C1 (Presidio NER) off with the decision model (router v0.10.0). On agent contexts
            # Presidio read technical names as people or places, and benign requests stayed LOCAL;
            # the decision model questions (person, family, health...) catch the personal data.
            # Presidio stays deployed. See README "Privacy classifier (C2)".
            - name: NER_ENABLED
              value: "0"
            {{- else }}
            - name: CLASSIFIER_BASE_URL
              value: {{ $qwenUrl | quote }}
            - name: CLASSIFIER_MODEL
              value: {{ .Values.global.localModel.name | quote }}
            {{- end }}
            - name: CLASSIFIER_GRAY_LOW
              value: {{ .Values.global.classifier.grayLow | quote }}
            # The local model reasons by default (Qwen3). The classifier needs a short JSON
            # verdict within its token budget, so its calls turn the reasoning off
            # (router v0.6.0 or later; a model without this switch ignores it).
            - name: CLASSIFIER_CHAT_TEMPLATE_KWARGS
              value: '{"enable_thinking": false}'
            {{- end }}
            {{- $np := .Values.global.namespacePolicy | default dict }}
            {{- if $np.scan }}
            # Namespace policy (router v0.11.0): find namespace names in the request text.
            - name: NAMESPACE_SCAN_ENABLED
              value: "1"
            {{- end }}
            {{- if $np.hint }}
            # Namespace policy (router v0.11.0): read the names that the agents send.
            - name: NAMESPACE_HINT_ENABLED
              value: "1"
            {{- end }}
            {{- with .Values.global.sota.servedMatch }}
            # Overrides sota_served_match in chain.yaml (cost gate).
            - name: SOTA_SERVED_MATCH
              value: {{ . | quote }}
            {{- end }}
            {{- if not .Values.global.sota.enabled }}
            # Local-only mode: sota-smart is the local model, its tokens are not SOTA tokens
            # (router v0.12.0).
            - name: SOTA_ENABLED
              value: "0"
            {{- end }}
            {{- $sb := .Values.global.sotaBudget | default dict }}
            {{- if $sb.enabled }}
            {{- $budgets := dict }}
            {{- range .Values.global.tiers }}
            {{- if .sotaTokens }}
            {{- $_ := set $budgets .name (int .sotaTokens) }}
            {{- end }}
            {{- end }}
            # SOTA budget per tier (router v0.12.0): SOTA tokens per window of each tier with
            # sotaTokens; counters in the Redis of this component (templates/redis.yaml).
            - name: SOTA_BUDGET_TIERS
              value: {{ toJson $budgets | quote }}
            - name: SOTA_BUDGET_WINDOW_S
              value: {{ $sb.windowSeconds | default 300 | quote }}
            - name: SOTA_BUDGET_REDIS_URL
              value: "redis://litellm-redis:6379/0"
            - name: SOTA_BUDGET_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-redis
                  key: password
            {{- end }}
          envFrom:
            # COMPANY_API_KEY. Optional: without it SOTA calls fail and LiteLLM
            # falls back to the local model.
            - secretRef:
                name: sota-provider-secret
                optional: true
            # External C2 classifier settings (component secrets, classifier.mode: external).
            - secretRef:
                name: classifier-provider-secret
                optional: true
          volumeMounts:
            - name: litellm-config
              mountPath: /app/litellm
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  selector:
    app: litellm
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: metrics
---
# User workload monitoring scrapes the router and LiteLLM metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  selector:
    matchLabels:
      app: litellm
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
# Node drains (for example a cluster upgrade) evict one replica at a time, so the other one
# keeps serving. maxUnavailable (not minAvailable) does not block drains with 1 replica.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: litellm
---
# LiteLLM is reachable only through the gateway (openshift-ingress): no bypass. The metrics
# port is open only to the monitoring namespaces (user workload Prometheus).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-gateway-only
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - protocol: TCP
          port: 4000
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.metricsPort }}
