apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      annotations:
        # Restart LiteLLM when its config changes (it reads the files only at start).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Restart LiteLLM when the secret store is turned on: env vars from Secrets are
        # read only at start.
        secret-store/enabled: {{ dig "secretStore" "enabled" false .Values.global | quote }}
    spec:
      # Prefer one replica per node. "Preferred": it never blocks scheduling.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: litellm
      containers:
        - name: litellm
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: ["litellm"]
          args: ["--config", "/app/litellm/config-chain.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: POLICY_DIR
              value: /app/litellm
            - name: PYTHONPATH
              value: /app/litellm
            {{- if eq .Values.global.classifier.mode "local" }}
            # C2 classifier = the local model: the prompt never leaves the cluster.
            - name: CLASSIFIER_ENABLED
              value: "1"
            - name: CLASSIFIER_BASE_URL
              value: {{ printf "http://%s-predictor.%s.svc.cluster.local/v1" .Values.global.localModel.name .Values.global.namespaces.models | quote }}
            - name: CLASSIFIER_MODEL
              value: {{ .Values.global.localModel.name | quote }}
            - name: CLASSIFIER_GRAY_LOW
              value: {{ .Values.global.classifier.grayLow | quote }}
            {{- end }}
            {{- with .Values.global.sota.servedMatch }}
            # Overrides sota_served_match in chain.yaml (cost gate).
            - name: SOTA_SERVED_MATCH
              value: {{ . | quote }}
            {{- end }}
          envFrom:
            # COMPANY_API_KEY. Optional: without it SOTA calls fail and LiteLLM
            # falls back to the local model.
            - secretRef:
                name: sota-provider-secret
                optional: true
            # External C2 classifier settings (component secrets, classifier.mode: external).
            - secretRef:
                name: classifier-provider-secret
                optional: true
          volumeMounts:
            - name: litellm-config
              mountPath: /app/litellm
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  selector:
    app: litellm
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Node drains (for example a cluster upgrade) evict one replica at a time, so the other one
# keeps serving. maxUnavailable (not minAvailable) does not block drains with 1 replica.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: litellm
---
# LiteLLM is reachable only through the gateway (openshift-ingress): no bypass.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-gateway-only
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - protocol: TCP
          port: 4000
