# `global` is passed by the bootstrap chart. The defaults below exist only for `helm lint`.
global:
  modelProfile: gpu
  namespaces:
    models: local-models
    observability: observability
  tiers:
    - name: research
      tokens: 100000
      window: 1m
    - name: legal
      tokens: 20000
      window: 5m
  localModel:
    name: example-local
  sota:
    enabled: true
    apiBase: https://sota.example.com/v1
    model: openai/example
    servedMatch: ""
    timeout: 300
    reasoning: false
  classifier:
    mode: local
    grayLow: "0"
  observability:
    enabled: true
    otlpEndpoint: http://otel-collector.observability.svc:4318
  namespacePolicy:
    scan: false
    hint: false

# Version (git tag) of the router repo (github.com/sovereign-selfheal/router). The hook
# code in files/*.py is a copy of that repo at this tag, and the image below must come
# from the same tag. scripts/sync-router-code.sh sets it and checks the copy (CI).
routerVersion: v0.11.1
# Image of the router repo: LiteLLM v1.102.0 + fastText language ID model.
# tag v0.11.1, resolved on quay.io on 2026-10-06 (same image as v0.3.0 to v0.11.0: the Containerfile
# did not change; it already has opentelemetry and prometheus_client)
image: quay.io/sovereign-selfheal/router@sha256:567be05d82ff91e88447870d5f6cca37d9bad12eadf91c806932c53be396c6e0
# Perses dashboard `routing-decisions` (Observe -> Dashboards), only with observability.enabled.
dashboard:
  # Tempo tenant of the router traces: keep it equal to tempo.tenant.name in
  # components/observability and to observability_tempo_tenant in the ansible repo.
  tempoTenant: router
  # Namespace of Limitador and Authorino (ansible repo, kuadrant_namespace): the dashboard
  # stack-operations reads their metrics (monitors of the ansible repo).
  kuadrantNamespace: kuadrant-system
# Port of the metrics server of the hook (env ROUTER_METRICS_PORT, router v0.5.0+): router
# metrics and LiteLLM metrics. Not exposed by the gateway.
metricsPort: 9091
# Timeout of one call to the local model (local-fast, auto, and sota-smart in local-only mode);
# the SOTA model has global.sota.timeout. Without streaming the whole answer must fit: Qwen3.8
# writes about 80 tokens/s per request (about 60 with 20 requests at once), and 85-92% of them are
# reasoning. 540 s is about 43k tokens. A streaming answer is not cut while tokens flow. Keep it
# below the 600 s of the Route and the load balancer (ansible repo).
requestTimeout: 540
# Retries per error type (LiteLLM router_settings.retry_policy). A timeout is not retried: the
# same work would run again on the GPU, and the client would wait up to 3 x requestTimeout.
# A key that is not set uses DefaultRetries (502, 504, connection errors). numRetries must stay
# above 0, otherwise LiteLLM ignores retry_policy.
numRetries: 2
retryPolicy:
  TimeoutErrorRetries: 0
  BadRequestErrorRetries: 0
  AuthenticationErrorRetries: 0
  RateLimitErrorRetries: 0
  ContentPolicyViolationErrorRetries: 0
  InternalServerErrorRetries: 1
  ServiceUnavailableErrorRetries: 1
  DefaultRetries: 1
# Two replicas, preferably on different nodes. If the SOTA token cap of the policy hook is on
# (sota_token_budget in files/chain.yaml, off by default), its counter is per pod.
replicas: 2
resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi
