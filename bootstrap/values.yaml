# Values of the ROOT Application. Ansible (playbooks/30-gitops-seed.yml in the
# `ansible` repo) creates the root Application and sets the per-cluster values
# below with `helm.valuesObject`. Everything else is a default of this repo.

# ----- Set by the seed (per cluster) ---------------------------------------------
# Apps domain of the cluster (ingresses.config/cluster .spec.domain).
appsDomain: ""
# Local model profile: `gpu` (Qwen3.8 27B on a GPU node) or `cpu` (small Qwen on CPU).
modelProfile: gpu
# External "SOTA" model, OpenAI compatible. enabled: false = local-only mode: the alias
# sota-smart points to the local model, so every request is served locally.
sota:
  enabled: false
  apiBase: ""        # e.g. https://<provider>/v1
  model: ""          # LiteLLM model string, e.g. openai/<model-id>
  servedMatch: ""    # substring of the served model id, used by the cost gate (env SOTA_SERVED_MATCH)
  # Seconds LiteLLM waits for one SOTA call. A reasoning model with a large token budget
  # can take about 3 minutes (the default of the other models is 120s).
  timeout: 300
  # false (default): LiteLLM asks the SOTA model to answer without reasoning
  # (chat_template_kwargs.enable_thinking=false, for vLLM-based providers and models with a
  # thinking switch such as Qwen3). With reasoning, the model often spent the whole token
  # budget on hidden reasoning and returned an empty answer. true: send nothing, the model
  # decides (also the right choice for providers that do not accept this parameter).
  reasoning: false

# ----- Repository and Argo CD ----------------------------------------------------
repo:
  url: https://github.com/sovereign-selfheal/gitops.git
  targetRevision: main
argocd:
  namespace: openshift-gitops
  project: sovereign-selfheal

# Namespaces are created by Ansible (with the argocd.argoproj.io/managed-by label).
namespaces:
  models: local-models
  router: maas-routing
  observability: observability
  # AI-driven triage demo (quarkus-buggy-app, ticketing-system, both MCP servers, triage-agent).
  triage: agentic-triage
  # Second quarkus-buggy-app, in a namespace labelled sovereign-selfheal.io/data-class=restricted
  # by the ansible repo: the agent investigates it with the local model only (namespacePolicy).
  triageRestricted: payments

# ----- Observability (traces of the router) --------------------------------------
# Set by the seed from observability_enabled. true: component observability (Tempo and the
# OpenTelemetry collector, needs the operators of the ansible repo) and LiteLLM sends its
# traces there. false: no traces; the router metrics stay on (they need only user workload
# monitoring).
observability:
  enabled: true
  # OTLP http endpoint of the collector `otel` (the operator names the Service otel-collector).
  otlpEndpoint: http://otel-collector.observability.svc:4318

# ----- Secrets (External Secrets Operator) ---------------------------------------
# The ClusterSecretStore is created by Ansible (roles/secrets_bootstrap) when a SOTA key
# is set; today it reads Secrets that Ansible lands in the namespace
# sovereign-selfheal-secrets (provider "kubernetes").
# enabled: false renders no ExternalSecret that needs the store: LiteLLM then
# starts without the SOTA key (expected: SOTA calls fall back to the local model).
secretStore:
  enabled: false
  name: sovereign-selfheal
  kind: ClusterSecretStore
  # Keys in the store (Secret name + key). See README "Secrets".
  sota:
    key: sota
    property: api_key
  classifier:
    key: classifier
    baseUrlProperty: base_url
    modelProperty: model
    apiKeyProperty: api_key

# C2 classifier (LLM) of the privacy gate. It runs only in the gray zone of the privacy
# score, when a prompt is about to go to the SOTA model.
#   local:    the local model (Qwen3.8 27B on GPU) classifies; the prompt never leaves the cluster
#   external: an external model, settings from the secret store (secretStore.enabled needed)
#   off:      no classifier, the rules alone decide
classifier:
  mode: local
  # Rules score below grayLow = clearly benign, no classifier call. "0" classifies every
  # prompt below the threshold, to catch sensitive content without keywords.
  grayLow: "0"

# API-key tiers (Authorino) and their token budgets (TokenRateLimitPolicy).
# The keys are generated in the cluster by an ESO Password generator.
# The budget counts all the tokens of a call (prompt, answer and SOTA reasoning), added
# when the answer ends; a call is refused (429) when it arrives with the budget used up.
# The counter is per tier: everyone with the same key shares it.
#   research: normal use, never blocks during a demo
#   legal:    strict tier, shows the 429 after a few long answers. The legal tier only uses
#             the local model, which reasons: one answer is 1.5-4k tokens, mostly reasoning.
#             20k tokens is about 5 long answers or 10 agent calls of 2k; answers sent one
#             after the other (about 50 s each) add up in the window, and after a 429 the
#             tier opens again within 5 minutes (a demo scene can be repeated soon).
tiers:
  - name: research
    tokens: 100000
    window: 1m
  - name: legal
    tokens: 20000
    window: 5m
  # Own credential of the triage-agent (components/triage-agent), so its tool-calling loop
  # (Prometheus + ticketing MCP round trips, several model calls per investigation) has a
  # budget separate from human tiers above.
  - name: agents
    tokens: 200000
    window: 5m

# ----- Local model profiles --------------------------------------------------------
# Images are pinned by digest, resolved on the date in the comment.
localModel:
  profiles:
    gpu:
      # The name must not contain the SOTA match token of chain.yaml (sota_served_match
      # "qwen38-27b", compared as bare alphanumerics): local calls would count as SOTA tokens.
      name: qwen38-local
      displayName: Qwen3.8 27B NVFP4 (local, vLLM GPU)
      runtime: vllm-cuda-runtime
      runtimeDisplayName: vLLM NVIDIA GPU ServingRuntime for KServe
      runtimeTemplate: vllm-cuda-runtime-template
      # RHOAI 3.5.1 template vllm-cuda-runtime-template, resolved on OCP 4.22.14 on 2026-09-24
      # (vLLM 0.24.0+rhaiv.13: runs Qwen3.8 with NVFP4, MTP and the qwen3 parsers, checked on 2026-09-28)
      runtimeImage: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:c056e61672b6aea489ad5dde0bd2f8497230f5333e87f7cf6c494eba3bfdc808
      runtimeVersion: v0.24.0
      # RedHatAI/Qwen3.8-27B-NVFP4 (24.7 GB), built by the modelcar repo.
      # tag qwen38-27b-nvfp4-d23c6ff, resolved on quay.io on 2026-09-28
      storageUri: oci://quay.io/sovereign-selfheal/modelcar-qwen38-27b-nvfp4@sha256:07490ed7b3ebbd8105de41712a61a3b206c862afdd48a60e7fde0b1f3a249661
      # NVFP4 runs natively on NVIDIA Blackwell (AWS g7e, RTX PRO 6000 96 GB). Only 16 of the
      # 64 layers keep a KV cache (FP8, about 32 KiB per token), so a long context is cheap.
      extraArgs:
        - --max-model-len=131072
        - --gpu-memory-utilization=0.90
        # Reuse the prefill of a repeated prefix (agent contexts grow turn by turn). vLLM leaves
        # it off for this hybrid model; with the flag it uses mamba cache mode "align" and reuses
        # whole blocks of 1600 tokens (FP8 KV cache). The SSM state stays float32, as set in the
        # model config (mamba_ssm_dtype). Measurements: router repo,
        # docs/qwen-prefix-cache-2026-10-02.md.
        - --enable-prefix-caching
        # Text only: the self-heal agents send no images; skips the vision encoder.
        - --language-model-only
        # Tool calls of the agents, and the reasoning moved out of `content`. The model reasons
        # by default (thinking mode, the mode of the published benchmarks); the sampling
        # defaults of its generation_config.json (temperature 1.0, top_p 0.95, top_k 20) are the
        # recommended ones for this mode. A caller turns it off with
        # chat_template_kwargs.enable_thinking=false, as the privacy classifier does
        # (CLASSIFIER_CHAT_TEMPLATE_KWARGS in components/litellm-router).
        - --enable-auto-tool-choice
        - --tool-call-parser=qwen3_xml
        - --reasoning-parser=qwen3
        # Speculative decoding with the multi-token prediction head shipped with the model.
        - '--speculative-config={"method": "mtp", "num_speculative_tokens": 3}'
      env: []
      gpu: 1
      # Nodes of the model (HardwareProfile and InferenceService). nvidia.com/gpu.present is on
      # every NVIDIA node. With the decision model there is a second GPU node, so the seed adds
      # node-role.kubernetes.io/gpu (the label of the Qwen pool of the ansible repo); Helm
      # merges the two maps.
      nodeSelector:
        nvidia.com/gpu.present: "true"
      # g7e.2xlarge: 8 vCPU, 64 GiB.
      resources:
        requests:
          cpu: "2"
          memory: 16Gi
        limits:
          cpu: "6"
          memory: 40Gi
      # RHOAI hardware profile shown in the dashboard (components/local-model/templates/hardwareprofile.yaml).
      hardwareProfile:
        displayName: NVIDIA RTX PRO 6000 (g7e.2xlarge)
        description: One NVIDIA RTX PRO 6000 Blackwell GPU (96 GB) on an AWS g7e.2xlarge node.
    cpu:
      name: qwen25-05b-local
      displayName: Qwen2.5 0.5B Instruct (local, vLLM CPU)
      runtime: vllm-cpu-x86-runtime
      runtimeDisplayName: vLLM CPU (x86) ServingRuntime for KServe
      runtimeTemplate: vllm-cpu-x86-runtime-template
      # RHOAI 3.5.1 template vllm-cpu-x86-runtime-template, resolved on OCP 4.22.14 on 2026-09-24
      runtimeImage: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:7a28b867955055a8836ea2a78e70b8bad63c1ee50e8a5f8dd95d1194f20ec489
      runtimeVersion: v0.24.0
      # tag qwen2.5-0.5b-instruct-20260810t1646z, resolved on quay.io on 2026-09-24
      storageUri: oci://quay.io/redhat-ai-services/modelcar-catalog@sha256:e20441c23be795838409137576b9016e6bc941eec79e5765cf9de6319c0ec769
      extraArgs: []
      env:
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "4"
      gpu: 0
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "4"
          memory: 8Gi
      hardwareProfile:
        displayName: CPU only (vLLM CPU)
        description: CPU and memory only, no GPU.

# ----- Namespace policy (router v0.11.0) -------------------------------------------
# A request about a namespace labelled sovereign-selfheal.io/data-class=restricted (set by the
# ansible repo) stays on the local model, before the gates. No label or "public" keeps the normal
# routing. Two switches, off in this file; the ansible seed sets them (its defaults: scan on,
# hint off):
#   scan: the router finds namespace names in the request text (PromQL, JSON, x.svc, -n x);
#   hint: the router reads the names that the agents send (body field selfheal_namespaces), and
#         triage-agent sends them (env ROUTER_NAMESPACE_HINT, triage-agent with /trigger namespaces).
# The ServiceAccount litellm reads the namespace labels: the ansible repo gives it get/list/watch
# on namespaces. See the router repo, README "Namespace policy".
namespacePolicy:
  scan: false
  hint: false

# ----- Decision model (component decision-model) ----------------------------------
# DiffusionGemma 26B-A4B FP8-dynamic served by the vLLM structured-read mode, behind the example
# decision server of vLLM (/v1/systemone: typed questions, one probability per answer from one
# forward pass). It runs on its own GPU node (gpu-decision pool of the ansible repo, one NVIDIA
# L40S on a g6e.2xlarge). Qwen3.8 is not changed.
# SUPPORT STATUS: unsupported preview image, for prototypes and proofs of concept. The example
# decision server is planned as Developer Preview in Red Hat AI Inference Server 3.6 GA and as
# Technology Preview in 3.7 EA1 (3.7 GA: path to general availability). Its API may change.
decisionModel:
  # Set by the seed (decision_model_enabled of the ansible repo).
  enabled: false
  # The name must not contain the SOTA match token of chain.yaml ("qwen38-27b").
  name: dgemma-decision
  displayName: DiffusionGemma 26B-A4B FP8 (decision model, vLLM structured-read)
  # Model name for vLLM and the decision server (label model_name of the vLLM metrics).
  servedModelName: dgemma
  runtime: vllm-structured-read-runtime
  # Shown in the RHOAI dashboard. The decision server is the example script of vLLM (see the
  # component's configmap.yaml).
  runtimeDisplayName: vLLM structured-read (preview) with the decision server
  # rhaii-preview/vllm-cuda-rhel9:diffusiongemma-jev (linux/amd64), resolved on registry.redhat.io
  # on 2026-09-30. vLLM 0.29.1.dev1248+rhaiv.2.rubin, CUDA 13.0. Unsupported preview.
  runtimeImage: registry.redhat.io/rhaii-preview/vllm-cuda-rhel9@sha256:24fccf947aa33857611efed0d57aead4efc525c78a882760db5229b702713a1a
  runtimeVersion: v0.29.1.dev1248
  # RedHatAI/diffusiongemma-26B-A4B-it-FP8-dynamic (27.2 GB), built by the modelcar repo.
  # tag diffusiongemma-26b-a4b-fp8-3b3dae4, resolved on quay.io on 2026-09-30
  storageUri: oci://quay.io/sovereign-selfheal/modelcar-diffusiongemma-26b-a4b-fp8@sha256:b10821319f60a03ec78e6aacf57bedca83e540fd8b0cbcbf3ffc644215e81fc6
  # Answer canvas of the structured-read mode, in tokens. vLLM and the decision server must agree.
  canvasLength: 64
  # Flags of the Red Hat quick start (validated with this checkpoint on 2026-09-25, and on an
  # L40S on 2026-09-30). No flag of the model card was needed. --max-num-seqs: 16 instead of the
  # quick start's 4 (a value for text generation with a 256-token canvas). With the 64-token
  # canvas of the decisions, 16 gives about 40 C2 calls/s instead of 18.7, with the same GPU memory
  # and the same latency for one call; 32 adds almost nothing (router
  # docs/c2-questions-eval-2026-10-03.md, measured on 2026-10-03).
  extraArgs:
    - --max-logprobs=32
    - --enable-prefix-caching
    - --max-num-seqs=16
    - --gpu-memory-utilization=0.85
    - --enforce-eager
  env:
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: expandable_segments:True
  gpu: 1
  nodeSelector:
    node-role.kubernetes.io/gpu-decision: ""
  # vLLM container. g6e.2xlarge: 8 vCPU, 64 GiB (57.8 GiB allocatable). After the load vLLM used
  # 31.2 GiB of host memory (2026-09-30).
  resources:
    requests:
      cpu: "4"
      memory: 36Gi
    limits:
      cpu: "6"
      memory: 48Gi
  # Decision server (kserve-container): 1.7 GiB after start (it loads the tokenizer).
  server:
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "1"
        memory: 4Gi
  # Namespaces that may call the decision server on :8080, besides the router (for example the
  # namespace of the self-heal agents).
  extraIngressNamespaces: []
  hardwareProfile:
    displayName: NVIDIA L40S (g6e.2xlarge)
    description: One NVIDIA L40S GPU (48 GB) on an AWS g6e.2xlarge node, for the decision model.

# ----- Components (one Argo CD Application each) --------------------------------
# wave: Argo CD sync wave of the Application; namespaceRef: key in `namespaces` above.
components:
  observability:
    enabled: true      # also needs observability.enabled
    wave: 0
    namespaceRef: observability
  secrets:
    enabled: true
    wave: 0
    namespaceRef: router
  local-model:
    enabled: true
    wave: 1
    namespaceRef: models
  decision-model:
    enabled: true      # also needs decisionModel.enabled
    wave: 1
    namespaceRef: models
  presidio:
    enabled: true
    wave: 1
    namespaceRef: router
  litellm-router:
    enabled: true
    wave: 2
    namespaceRef: router
  frontdoor:
    enabled: true
    wave: 3
    namespaceRef: router
  # AI-driven triage demo: a buggy sample app, a ticketing system it can be reported to,
  # two MCP tool servers (Prometheus + ticketing), and an agent that ties them together.
  # Source and images: see AGENTS.md section 3b.
  quarkus-buggy-app:
    enabled: true
    wave: 1
    namespaceRef: triage
  # The same chart (key `chart`) in the restricted namespace: the agent investigates this one
  # with the local model only (namespacePolicy).
  quarkus-buggy-app-restricted:
    enabled: true
    chart: quarkus-buggy-app
    wave: 1
    namespaceRef: triageRestricted
  ticketing-system:
    enabled: true
    wave: 1
    namespaceRef: triage
  prometheus-mcp-server:
    enabled: true
    wave: 2
    namespaceRef: triage
  ticketing-mcp-server:
    enabled: true
    wave: 2
    namespaceRef: triage
  triage-agent:
    enabled: true
    # After frontdoor (wave 3): the agent calls router.<appsDomain>, which frontdoor exposes.
    wave: 4
    namespaceRef: triage
  ogx-alert-translator:
    enabled: true
    # After triage-agent: forwards Alertmanager webhooks to triage-agent's /trigger on :7860.
    wave: 5
    namespaceRef: triage
  # Live page of the routing decisions and of the namespace labels (repo routing-live-view),
  # behind the OpenShift oauth-proxy. Reads the LiteLLM logs, so it lives next to the router.
  routing-live-view:
    enabled: true
    wave: 5
    namespaceRef: router
